<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacLauncher demo</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="demoBar">
      <a class="demoHome" href="../">MacLauncher</a>
      <p>This is the real launcher interface running on example data. Buttons explain what they do instead of doing it.</p>
    </header>
    <main class="demo">
      <section class="launcherPane" aria-label="Launcher">
        <nav class="demoMenu" aria-label="Menu bar"></nav>
        <iframe class="libraryFrame" title="MacLauncher library"></iframe>
        <div class="utilityWindow" hidden>
          <div class="utilityBar">
            <div class="trafficLights">
              <button type="button" class="light close" aria-label="Close window"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.6 1.6l4.8 4.8M6.4 1.6L1.6 6.4"/></svg></button>
              <button type="button" class="light minimize" aria-label="Minimize window"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.2 4h5.6"/></svg></button>
              <button type="button" class="light zoom" aria-label="Zoom window"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.7 6.3V2.8l3.5 3.5zM6.3 1.7v3.5L2.8 1.7z"/></svg></button>
            </div>
            <span class="utilityTitle"></span>
          </div>
          <iframe class="utilityFrame" title="MacLauncher window"></iframe>
        </div>
      </section>
      <aside class="articlePane" aria-label="Related articles">
        <h2>Read more</h2>
        <p class="articleLead"></p>
        <section class="needs" aria-labelledby="needs-title" hidden>
          <h3 id="needs-title">What this needs</h3>
          <ul class="needsList"></ul>
        </section>
        <ol class="articleList"></ol>
        <a class="articleOpen" target="_blank">Open this article</a>
        <iframe class="articlePreview" title="Article preview"></iframe>
      </aside>
    </main>
    <script type="module" src="./src/shell.ts"></script>
  </body>
</html>
