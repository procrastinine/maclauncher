<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Helvetica</family><family>Hiragino Sans</family></prefer></alias>
  <alias><family>Tahoma</family><prefer><family>Helvetica</family><family>Hiragino Sans</family></prefer></alias>
</fontconfig>
